apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.streaming.name }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.services.streaming.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.streaming.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.streaming.name }}

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: streaming

          image: "{{ .Values.services.streaming.image }}:{{ .Values.services.streaming.tag }}"

          ports:
            - containerPort: {{ .Values.services.streaming.port }}

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: STREAMING_PORT

            - name: MONGO_URI
              value: "mongodb://mongo:27017/{{ .Values.config.mongoDb }}"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_REGION

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_S3_BUCKET

            - name: AWS_CDN_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_CDN_URL

            - name: STREAMING_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: STREAMING_PUBLIC_URL

          readinessProbe:
            tcpSocket:
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: {{ .Values.services.streaming.port }}
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"