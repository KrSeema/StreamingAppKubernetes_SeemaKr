apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.auth.name }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.services.auth.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Values.services.auth.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.services.auth.name }}

    spec:
      containers:
        - name: auth

          image: "{{ .Values.services.auth.image }}:{{ .Values.services.auth.tag }}"

          ports:
            - containerPort: {{ .Values.services.auth.port }}

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AUTH_PORT

            - name: MONGO_URI
              value: "mongodb://mongo:27017/{{ .Values.config.mongoDb }}"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: JWT_SECRET

            - name: CLIENT_URLS
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: CLIENT_URLS

            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: AWS_REGION

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: streamingapp-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: HOST

            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: streamingapp-config
                  key: JWT_EXPIRES_IN

          readinessProbe:
            tcpSocket:
              port: {{ .Values.services.auth.port }}
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: {{ .Values.services.auth.port }}
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"