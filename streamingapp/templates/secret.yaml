apiVersion: v1
kind: Secret
metadata:
  name: streamingapp-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JWT_SECRET: "{{ .Values.secret.jwtSecret }}"
  AWS_ACCESS_KEY_ID: "{{ .Values.secret.awsAccessKeyId }}"
  AWS_SECRET_ACCESS_KEY: "{{ .Values.secret.awsSecretAccessKey }}"