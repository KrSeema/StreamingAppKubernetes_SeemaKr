  CLIENT_URLS: "http://localhost:3000"

  AWS_REGION: "ap-south-1"

  AWS_S3_BUCKET: ""

  AWS_CDN_URL: ""

  STREAMING_PUBLIC_URL: "http://streaming-svc:3002"

  HOST: "http://localhost:3000"

  JWT_EXPIRES_IN: "24h"