apiVersion: v1
kind: ConfigMap
metadata:
  name: streamingapp-config
  namespace: streamingapp

data:
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "streamingapp"

  AUTH_PORT: "3001"
  STREAMING_PORT: "3002"
  ADMIN_PORT: "3003"
