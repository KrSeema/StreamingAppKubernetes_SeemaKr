apiVersion: v1
kind: Namespace
metadata:
  name: streamingapp
---
# Source: streamingapp/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: streamingapp-secret
  namespace: streamingapp
type: Opaque
stringData:
  JWT_SECRET: "streamingapp-dev-secret-change-me"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
# Source: streamingapp/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamingapp-config
  namespace: streamingapp
data:
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_DB: "streamingapp"

  AUTH_PORT: "3001"
  STREAMING_PORT: "3002"
  ADMIN_PORT: "3003"
  CHAT_PORT: "3004"

  CLIENT_URLS: "http://localhost:3000"

  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: ""
  AWS_CDN_URL: ""

  STREAMING_PUBLIC_URL: "http://streaming-svc:3002"

  HOST: "http://localhost:3000"
  JWT_EXPIRES_IN: "24h"
---
